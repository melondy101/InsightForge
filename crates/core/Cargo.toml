[package]
name = "insightforge-core"
version.workspace = true
edition.workspace = true
description = "InsightForge 桌面核心：SQLite repository、版本化迁移与领域服务"

[dependencies]
globset = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 08 号票：AI 连接测试/样例调用的真实传输层（可注入 AiHttpClient seam 的默认实现；
# rustls(ring) + webpki 根证书，无 tokio，阻塞式适合命令路径上的一次性调用）。
ureq = { version = "3", default-features = false, features = ["rustls", "rustls-webpki-roots"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

# 08 号票：BYOK 密钥经 keyring 存入 Windows Credential Manager（Windows 首发；
# 其他平台编译可用、运行时显式拒绝，见 secrets.rs）。v1 = 简单同步 API。
[target.'cfg(windows)'.dependencies]
keyring = { version = "4", default-features = false, features = [
    "v1",
    "windows-native-keyring-store",
] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
