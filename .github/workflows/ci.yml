name: CI

# 桌面重写期间的持续集成（01 号票）：
# - Windows + Ubuntu 各编译 Rust core（insightforge-core）并跑平台无关测试；
# - 前端门禁（lint / tsc / vitest / vite build）在 Ubuntu 上跑一次即可。
# 打包签名发布不在本 workflow 范围（见票据 14）。

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (core)
        run: cargo clippy -p insightforge-core -- -D warnings

      - name: cargo test (core)
        run: cargo test -p insightforge-core --locked

      - name: cargo build (core)
        run: cargo build -p insightforge-core --locked

  frontend:
    name: Frontend gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: eslint
        run: bun run lint

      - name: tsc --noEmit
        run: bunx tsc --noEmit

      - name: vitest
        run: bun run test

      - name: vite build
        run: bun run build
