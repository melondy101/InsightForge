name: CI

# 持续集成（每次 push / PR）：
# - Windows + Ubuntu 各编译 Rust core（insightforge-core）并跑平台无关测试；
# - 桌面 crate（insightforge-desktop，含 Tauri 命令层）只在 Windows 上编译与测试，
#   因为只有它跑得动；缺了这条，src-tauri 的编译错误要等到本地才看得见。
# - 前端门禁（lint / tsc / vitest / vite build）在 Ubuntu 上跑一次即可。
# 打包、签名与发布在 release.yml（打 v* tag 触发）。

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (core)
        run: cargo clippy -p insightforge-core -- -D warnings

      - name: cargo test (core)
        run: cargo test -p insightforge-core --locked

      - name: cargo build (core)
        run: cargo build -p insightforge-core --locked

  desktop:
    name: Desktop crate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: cargo clippy (desktop)
        run: cargo clippy -p insightforge-desktop --all-targets -- -D warnings

      - name: cargo test (desktop)
        run: cargo test -p insightforge-desktop --locked

  frontend:
    name: Frontend gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version sources agree
        shell: bash
        run: |
          pkg=$(bun -e "console.log(require('./package.json').version)")
          cargo=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$pkg" != "$cargo" ]; then
            echo "::error::package.json ($pkg) 与 workspace Cargo.toml ($cargo) 版本不一致"
            exit 1
          fi

      - name: eslint
        run: bun run lint

      - name: tsc --noEmit
        run: bunx tsc --noEmit

      - name: vitest
        run: bun run test

      - name: vite build
        run: bun run build
